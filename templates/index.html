<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>German TTS Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #121212; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background-color: #1E1E1E; border: 2px solid #FFD700; border-radius: 15px; padding: 30px; width: 100%; max-width: 500px; text-align: center; box-shadow: 0 0 20px rgba(255, 215, 0, 0.2); }
        h1 { color: #FFD700; margin-bottom: 10px; font-size: 24px; }
        p.subtitle { color: #A0A0A0; margin-bottom: 20px; font-size: 14px; }
        textarea { width: 100%; height: 120px; background-color: #121212; color: white; border: 1px solid #FFD700; border-radius: 8px; padding: 10px; font-size: 16px; resize: none; outline: none; }
        textarea:focus { box-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
        .buttons { display: flex; gap: 10px; margin-top: 20px; justify-content: center; }
        button { padding: 12px 20px; border-radius: 8px; border: none; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; }
        .btn-generate { background-color: #FFD700; color: #000; flex: 1; }
        .btn-generate:hover { background-color: #B8860B; }
        .btn-play { background-color: #333; color: #FFD700; border: 2px solid #FFD700; flex: 1; }
        .btn-play:hover { background-color: #444; }
        .btn-play:disabled { opacity: 0.5; cursor: not-allowed; }
        #status { margin-top: 15px; font-size: 14px; color: #888; min-height: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>German Text to Speech</h1>
        <p class="subtitle">Enter German text and click Generate</p>
        
        <textarea id="textInput" placeholder="Type German text here...">Guten Tag! Wie geht es Ihnen heute?</textarea>
        
        <div class="buttons">
            <button class="btn-generate" id="generateBtn" onclick="generateAudio()">Generate Audio</button>
            <button class="btn-play" id="playBtn" onclick="playAudio()" disabled>Play Audio</button>
        </div>
        
        <div id="status">Ready to generate...</div>
        <audio id="audioPlayer" style="display:none;"></audio>
    </div>

    <script>
        let audioUrl = "";

        async function generateAudio() {
            const text = document.getElementById("textInput").value.trim();
            const status = document.getElementById("status");
            const generateBtn = document.getElementById("generateBtn");
            const playBtn = document.getElementById("playBtn");

            if (!text) {
                status.innerText = "⚠️ Please enter some text!";
                status.style.color = "#FF5555";
                return;
            }

            generateBtn.disabled = true;
            generateBtn.innerText = "Generating...";
            status.innerText = "⏳ Fetching audio from server...";
            status.style.color = "#FFD700";

            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });

                const data = await response.json();

                if (data.success) {
                    audioUrl = data.audio_url;
                    status.innerText = "✅ Audio generated successfully!";
                    status.style.color = "#55FF55";
                    generateBtn.disabled = false;
                    generateBtn.innerText = "Generate Audio";
                    playBtn.disabled = false;
                    playAudio();
                } else {
                    throw new Error(data.error);
                }
            } catch (error) {
                status.innerText = "❌ Error: " + error.message;
                status.style.color = "#FF5555";
                generateBtn.disabled = false;
                generateBtn.innerText = "Generate Audio";
            }
        }

        function playAudio() {
            if (audioUrl) {
                const player = document.getElementById("audioPlayer");
                player.src = audioUrl;
                player.play();
            }
        }
    </script>
</body>
</html>
